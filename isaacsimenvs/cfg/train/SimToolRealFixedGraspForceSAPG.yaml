params:
  seed: 42
  env:
    clip_observations: 10.0
    clip_actions: 1.0
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: coef_cond
    mlp:
      units: [256, 256, 128]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
    rnn:
      name: lstm
      units: 128
      layers: 1
      before_mlp: true
      layer_norm: true
  load_checkpoint: false
  load_path: ''
  config:
    name: 0_fixed_grasp_normal_force_sapg
    full_experiment_name: ${.name}
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    normalize_advantage: true
    reward_shaper:
      scale_value: 1.0
    num_actors: ${....env.scene.num_envs}
    gamma: 0.99
    tau: 0.95
    learning_rate: 1.0e-4
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.016
    score_to_win: 1000000
    max_epochs: 3000
    save_best_after: 50
    save_frequency: 250
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: true
    e_clip: 0.1
    minibatch_size: 65536
    mini_epochs: 2
    critic_coef: 4.0
    clip_value: true
    horizon_length: 16
    seq_length: 16
    bounds_loss_coef: 0.0001
    central_value_config:
      minibatch_size: 65536
      mini_epochs: 2
      learning_rate: 1.0e-4
      kl_threshold: 0.016
      clip_value: true
      normalize_input: true
      truncate_grads: true
      network:
        name: actor_critic
        central_value: true
        mlp:
          units: [256, 256, 128]
          activation: elu
          d2rl: false
          initializer:
            name: default
          regularizer:
            name: None
    use_others_experience: lf
    off_policy_ratio: 1.0
    expl_type: mixed_expl_learn_param
    expl_reward_type: entropy
    expl_reward_coef_embd_size: 32
    expl_reward_coef_scale: 0.002
    expl_coef_block_size: 4096
    player:
      deterministic: true
      games_num: 100
      print_stats: false
