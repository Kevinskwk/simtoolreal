# TacMap compact contact-feature task.
#
# This follows sharpa-rl-lab's rotation task tactile feature style, extended
# with contact centroids: [area, center_x, center_y] per finger are appended to
# the actor observation.

use_tacmap: true
enable_vbts: true
include_tacmap_in_policy: true
resolution_step: 20
vbts_update_period: 0.016666666666666666

tacmap_obs_normalization: 255.0
enable_tactile: true
binary_contact: false
contact_smooth: 0.5
contact_latency: 0.005
contact_threshold: 0.05
contact_sensor_noise: 0.01
tacmap_history_len: 5
disable_tactile_ids: []

scene:
  num_envs: 12288

obs:
  state_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot, palm_vel,
               object_rot, object_vel, fingertip_pos_rel_palm, keypoints_rel_palm,
               keypoints_rel_goal, object_scales, closest_keypoint_max_dist,
               closest_fingertip_dist, lifted_object, progress, successes, reward]
  obs_list: [joint_pos, joint_vel, prev_action_targets, palm_pos, palm_rot,
             object_rot, fingertip_pos_rel_palm, keypoints_rel_palm,
             keypoints_rel_goal, object_scales, tacmap]
  clamp_abs_observations: 10.0
